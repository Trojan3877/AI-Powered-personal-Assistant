name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release-artifacts:
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build source archive and checksum
        run: |
          mkdir -p dist
          git archive --format=tar.gz --output "dist/ai-powered-personal-assistant-${GITHUB_REF_NAME}.tar.gz" HEAD
          sha256sum "dist/ai-powered-personal-assistant-${GITHUB_REF_NAME}.tar.gz" > "dist/ai-powered-personal-assistant-${GITHUB_REF_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ai-powered-personal-assistant-${{ github.ref_name }}.tar.gz
            dist/ai-powered-personal-assistant-${{ github.ref_name }}.sha256

  publish-image:
    name: Publish GHCR Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/coreyleath-code/ai-powered-personal-assistant:${{ github.ref_name }}
            ghcr.io/coreyleath-code/ai-powered-personal-assistant:latest

  summary:
    name: Release Summary
    needs: [release-artifacts, publish-image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write workflow summary
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- Trigger: semantic version tag"
            echo "- GitHub Release: generated notes + source archive + SHA-256 checksum"
            echo "- GHCR: ai-powered-personal-assistant image tagged with the release tag and latest"
          } >> "$GITHUB_STEP_SUMMARY"
